<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prediction History | Smart Surveillance</title>

    <link rel="stylesheet"
          href="../css/dashboard.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <h2>🎥 Surveillance</h2>

        <ul>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>


            <li class="active">
                <a href="history.html">
                    History
                </a>
            </li>

            <li>
                <a href="profile.html">
                    Profile
                </a>
            </li>

            <li>
                <a href="settings.html">
                    Settings
                </a>
            </li>

            <li id="logoutBtn">
                Logout
            </li>

        </ul>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="main">

        <!-- Header -->

        <div class="header">

            <h1>
                Prediction History
            </h1>

            <div class="user">
                Welcome, User 👋
            </div>

        </div>


        <!-- History -->

        <div class="prediction-box">

            <h2>
                Previous Predictions
            </h2>


            <table class="result-table">

                <thead>

                    <tr>

                        <th>
                            Video Name
                        </th>

                        <th>
                            Activity
                        </th>

                        <th>
                            Confidence
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="historyTable">

                    <tr>

                        <td colspan="4"
                            style="text-align:center;">

                            Loading history...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/history.js"></script>

</body>

</html>
