<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Surveillance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/register.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

</head>

<body>

<div class="overlay">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-6 col-md-8">

<div class="register-card">

<div class="text-center mb-4">

<img src="../images/logo.png" class="logo">

<h2 class="mt-3">Create Account</h2>

<p>Register to Smart Surveillance System</p>

</div>

<form id="registerForm">

<div class="mb-3">

<label>Full Name</label>

<input
type="text"
class="form-control"
id="name"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label>Email Address</label>

<input
type="email"
class="form-control"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<div class="input-group">

<input
type="password"
class="form-control"
id="password"
placeholder="Enter password"
required>

<button
class="btn btn-eye"
type="button"
id="togglePassword">

<svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M2 2L22 22" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M6.71277 6.7226C3.66479 8.79527 2 12 2 12C2 12 5.63636 19 12 19C14.0503 19 15.8174 18.2734 17.2711 17.2884M11 5.05822C11.3254 5.02013 11.6588 5 12 5C18.3636 5 22 12 22 12C22 12 21.3082 13.3317 20 14.8335" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M14 14.2362C13.4692 14.7112 12.7684 15.0001 12 15.0001C10.3431 15.0001 9 13.657 9 12.0001C9 11.1764 9.33193 10.4303 9.86932 9.88818" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

</button>

</div>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<div class="input-group">

<input
type="password"
class="form-control"
id="confirmPassword"
placeholder="Confirm password"
required>

<button
class="btn btn-eye"
type="button"
id="toggleConfirmPassword">

<svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M2 2L22 22" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M6.71277 6.7226C3.66479 8.79527 2 12 2 12C2 12 5.63636 19 12 19C14.0503 19 15.8174 18.2734 17.2711 17.2884M11 5.05822C11.3254 5.02013 11.6588 5 12 5C18.3636 5 22 12 22 12C22 12 21.3082 13.3317 20 14.8335" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M14 14.2362C13.4692 14.7112 12.7684 15.0001 12 15.0001C10.3431 15.0001 9 13.657 9 12.0001C9 11.1764 9.33193 10.4303 9.86932 9.88818" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

</button>

</div>

</div>

<button
type="submit"
class="btn register-btn w-100">

Create Account

</button>

<div class="text-center mt-4">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="../js/toast.js"></script>
<script src="../js/register.js"></script>

</body>

</html>
